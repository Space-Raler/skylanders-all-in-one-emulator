# /data/skylanders/skyportal.ini
port=8787
# Diagnostic stage for bring-up only (1..4). Leave it commented out for a normal full run.
# Raise it one step per run until the console crashes; the last 'step:' line in the log is the step that was running.
#   1 resolve imports + check memory (reads only)      2 + write hook into the game (nothing uses it yet)
#   3 + suspend/patch/resume with hooks DISABLED         4 + enable hooks (= full)
#stage=1
# Wait this long (ms) after the game's title appears before hooking. Hooking while the game is still starting up,
# before it asks for the portal, can leave a black screen. 25 seconds is the default.
settle_ms=25000

# One line per game. ctx=0/1 = whether sceUsbdInit/GetDeviceList/HandleEvents* take a leading
# context argument (README "Open questions" #1; flip it if the game crashes right after hooking).
# check= is what sceUsbdCheckConnected returns (semantics unverified; 0 first).
#
# Swap Force (CUSA id taken from the eboot strings in the earlier analysis):
title=CUSA00019 ctx=0 check=0
# Trap Team: this id is the one hard-coded in SkyPortal Helper 0.4.0 (found next to its Trap Team strings).
# It is one region's id; other regions have different CUSA ids, add a line per region you own.
title=CUSA00697 ctx=0 check=0

# Answer idle IN polls with a status report about this often (ms), like a real portal does. 0 = only answer commands and
# figure changes (the old behaviour). Only counts time the game spends sleeping in its USB event loop.
#idle_status=22

# Write figure progress (XP, gold, upgrades ...) back to the figure files automatically (default 1).
# 0 = read-only: only the "Save now" button writes. The first overwrite of a file keeps the original in backup/.
#autosave=1
